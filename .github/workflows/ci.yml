name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  e2e:
    name: Cypress (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Run Cypress
        uses: cypress-io/github-action@v6
        with:
          browser: ${{ matrix.browser }}
          # Change or remove --env configFile=... to target a real environment.
          command: npx cypress run --browser ${{ matrix.browser }} --env configFile=staging

      # cypress-mochawesome-reporter writes the combined HTML report to
      # cypress/reports/index.html automatically at the end of the run.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-report-${{ matrix.browser }}
          path: cypress/reports
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload failure screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-screenshots-${{ matrix.browser }}
          path: cypress/reports/screenshots
          if-no-files-found: ignore
          retention-days: 7
